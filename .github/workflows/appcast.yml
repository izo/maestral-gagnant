name: Update Sparkle appcast

# Disabled for the maestral-gagnant fork: this checks out the upstream `website`
# branch and uses upstream Sparkle signing secrets to publish the macOS app bundle
# appcast, neither of which exist in this fork. Re-enable if the fork ships a signed
# macOS app bundle.
on:
  workflow_dispatch:

jobs:
  generate_appcast:
    if: ${{ false }}
    runs-on: macos-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v5
        with:
          ref: website

      - uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.x'

      - name: Install requirements
        run: |
          brew install pandoc
          python3 -m pip install requests

      - name: Generate appcast
        run: |
          python3 _scripts/generate_appcast.py
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE }}

      - name: Push back appcast updates
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Auto-commit appcast updates
