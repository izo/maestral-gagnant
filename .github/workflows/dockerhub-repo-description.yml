name: Uploads Maestral repo description to hub.docker.com

# Disabled for the maestral-gagnant fork: this pushes to the upstream DockerHub
# repository (maestraldbx/maestral) and requires upstream secrets. Re-enable and
# repoint DOCKERHUB_REPOSITORY once the fork has its own DockerHub repo.
on:
  workflow_dispatch:

jobs:
  dockerhub-repo-description:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Update repo description
        uses: peter-evans/dockerhub-description@v5
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
          DOCKERHUB_REPOSITORY: maestraldbx/maestral
